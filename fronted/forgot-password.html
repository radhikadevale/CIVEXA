<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CIVEXA</title>

    <link rel="stylesheet"
          href="forgot-password.css">

</head>

<body>

    <div class="forgot-container">

        <div class="forgot-card">

            <div class="logo">
                ◆ CIVEXA
            </div>

            <h1>Forgot Password?</h1>

            <p class="description">
                Enter your registered email address and
                we'll help you reset your CIVEXA password.
            </p>

            <form id="forgotPasswordForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <span>✉</span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your registered email"
                            required
                        >

                    </div>

                </div>

                <button type="submit"
                        class="continue-button">

                    Continue

                    <span>→</span>

                </button>

            </form>

            <div class="message"
                 id="message">
            </div>

            <a href="login.html"
               class="back-login">

                ← Back to Login

            </a>

        </div>

    </div>


    <script>

        const form =
            document.getElementById("forgotPasswordForm");

        const email =
            document.getElementById("email");

        const message =
            document.getElementById("message");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            try {

                const response = await fetch(
                    "http://localhost:3000/api/auth/forgot-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email.value
                        })
                    }
                );

                const result =
                    await response.json();

                  if (response.ok) {

    window.location.href =
        "reset-password.html?token=" +
        encodeURIComponent(result.reset_token);

} else {

    message.textContent =
        result.message;

    message.classList.add("show");

}

            }
            catch (error) {

                console.error(
                    "Forgot password error:",
                    error
                );

                alert(
                    "Unable to connect to CIVEXA server. Make sure the backend is running."
                );

            }

        });

    </script>

</body>

</html>
