<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password | CIVEXA</title>

    <link rel="stylesheet"
          href="change-password.css">

</head>

<body>

    <div class="change-password-container">

        <div class="change-password-card">

            <!-- LOGO -->

            <div class="logo">
                <span>◆</span> CIVEXA
            </div>


            <!-- HEADING -->

            <span class="eyebrow">
                ACCOUNT SECURITY
            </span>

            <h1>
                Change Password
            </h1>

            <p class="description">
                Update your CIVEXA account password securely.
            </p>


            <!-- FORM -->

            <form id="changePasswordForm">


                <!-- CURRENT PASSWORD -->

                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter your current password"
                        required>

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter your new password"
                        required>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your new password"
                        required>

                </div>


                <!-- BUTTONS -->

                <div class="button-group">

                    <button
                        type="submit"
                        class="update-button">

                        Update Password
                        <span>→</span>

                    </button>


                    <button
                        type="button"
                        class="cancel-button"
                        id="cancelButton">

                        Cancel

                    </button>

                </div>

            </form>


            <!-- MESSAGE -->

            <div
                class="message"
                id="message">
            </div>


            <!-- BACK -->

            <a
                href="profile.html"
                class="back-profile">

                ← Back to Profile

            </a>

        </div>

    </div>


    <script>

        /* ================= LOAD LOGGED-IN USER ================= */

        const storedUser =
            localStorage.getItem("civexaUser");


        if (!storedUser) {

            alert("Please login first.");

            window.location.href =
                "login.html";

        }


        const user =
            JSON.parse(storedUser);


        /* ================= ELEMENTS ================= */

        const form =
            document.getElementById(
                "changePasswordForm"
            );

        const currentPassword =
            document.getElementById(
                "currentPassword"
            );

        const newPassword =
            document.getElementById(
                "newPassword"
            );

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );

        const message =
            document.getElementById(
                "message"
            );

        const cancelButton =
            document.getElementById(
                "cancelButton"
            );


        /* ================= CANCEL ================= */

        cancelButton.addEventListener(
            "click",
            function () {

                window.location.href =
                    "profile.html";

            }
        );


        /* ================= CHANGE PASSWORD ================= */

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /* CHECK NEW PASSWORD MATCH */

                if (
                    newPassword.value !==
                    confirmPassword.value
                ) {

                    message.textContent =
                        "New passwords do not match.";

                    message.classList.add("show");

                    return;

                }


                /* CHECK PASSWORD LENGTH */

                if (
                    newPassword.value.length < 6
                ) {

                    message.textContent =
                        "New password must be at least 6 characters.";

                    message.classList.add("show");

                    return;

                }


                try {

                    const response =
                        await fetch(
                            `http://localhost:3000/api/auth/change-password/${user.user_id}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    currentPassword:
                                        currentPassword.value,

                                    newPassword:
                                        newPassword.value

                                })

                            }
                        );


                    const result =
                        await response.json();


                    /* ================= ERROR ================= */

                    if (!response.ok) {

                        message.textContent =
                            result.message ||
                            "Password change failed.";

                        message.classList.add(
                            "show"
                        );

                        return;

                    }


                    /* ================= SUCCESS ================= */

                    message.textContent =
                        "Password changed successfully! Redirecting to login...";

                    message.classList.add(
                        "show"
                    );


                    form.reset();


                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        2000
                    );


                } catch (error) {

                    console.error(
                        "Change password error:",
                        error
                    );

                    message.textContent =
                        "Unable to connect to CIVEXA server. Please make sure the backend is running.";

                    message.classList.add(
                        "show"
                    );

                }

            }
        );

    </script>

</body>

</html>
