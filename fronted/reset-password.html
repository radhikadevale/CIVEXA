<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CIVEXA</title>

    <link rel="stylesheet"
          href="reset-password.css">

</head>

<body>

    <div class="reset-container">

        <div class="reset-card">

            <div class="logo">
                ◆ CIVEXA
            </div>

            <h1>Reset Password</h1>

            <p class="description">
                Create a new password for your CIVEXA account.
            </p>

            <form id="resetPasswordForm">

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter new password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >

                </div>


                <button type="submit"
                        class="reset-button">

                    Reset Password

                    <span>→</span>

                </button>

            </form>


            <div class="message"
                 id="message">
            </div>


            <a href="login.html"
               class="back-login">

                ← Back to Login

            </a>

        </div>

    </div>


    <script>

        const form =
            document.getElementById("resetPasswordForm");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const message =
            document.getElementById("message");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            if (password.value !== confirmPassword.value) {

                alert("Passwords do not match.");

                return;

            }


            /*
             * Get reset token from URL
             *
             * Example:
             * reset-password.html?token=abc123
             */

            const params =
                new URLSearchParams(window.location.search);

            const token =
                params.get("token");


            if (!token) {

                alert("Invalid or missing reset token.");

                return;

            }


            try {

                const response = await fetch(
                    "http://localhost:3000/api/auth/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            token: token,

                            password: password.value

                        })

                    }
                );


                const result =
                    await response.json();


                    if (response.ok) {

    message.textContent =
        "Password reset successfully! Redirecting to login...";

    message.classList.add("show");

    form.reset();

    setTimeout(function () {

        window.location.href = "login.html";

    }, 2000);

} else {

    alert(result.message);

}


            } catch (error) {

                console.error(
                    "Reset password error:",
                    error
                );

                alert(
                    "Unable to connect to CIVEXA server. Make sure the backend is running."
                );

            }

        });

    </script>

</body>

</html>
